<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EverLoyal — "I’m In!" success transition (prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root {
    --el-blue: oklch(0.42 0.17 272); --el-blue-deep: oklch(0.3 0.13 272); --el-lime: oklch(0.88 0.2 128);
    --el-orange: oklch(0.74 0.17 52); --el-cream: oklch(0.97 0.025 85); --el-ink: oklch(0.24 0.06 272);
    --pop: cubic-bezier(.3, 1.4, .5, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--el-blue);
    font-family: Nunito, system-ui, sans-serif; color: var(--el-cream); }
  .card { width: min(380px, 92vw); background: var(--el-blue-deep); border-radius: 32px; padding: 24px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / .1); }
  .card h1 { font: 600 24px/1.2 Fredoka, sans-serif; margin: 0; }
  .card h1 span { display: block; font-size: 17px; color: var(--el-lime); margin-top: 2px; }
  .note { font-size: 13px; opacity: .85; margin: 14px 0 18px; }
  .cta { width: 100%; border: 0; border-radius: 999px; background: var(--el-orange); color: var(--el-ink); cursor: pointer;
    font: 600 18px Fredoka, sans-serif; padding: 16px; display: flex; gap: 8px; align-items: center; justify-content: center; transition: transform .15s; }
  .cta:active { transform: scale(.95); }
  .cta:disabled { opacity: .7; cursor: progress; }
  .cta svg { width: 20px; height: 20px; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }

  /* Success moment */
  .overlay { position: fixed; inset: 0; background: var(--el-blue-deep); display: grid; place-items: center; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .18s ease-out; }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .badge { position: relative; width: 132px; height: 132px; margin: 0 auto; }
  .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--el-lime); transform: scale(0); }
  .on .disc { animation: pop .45s var(--pop) .08s forwards; }
  .tick { position: absolute; inset: 0; }
  .tick path { fill: none; stroke: var(--el-ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; }
  .on .tick path { animation: draw .32s ease-out .42s forwards; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--el-lime); opacity: 0; }
  .on .ring { animation: ripple .9s ease-out .5s; }
  .on .ring.r2 { animation-delay: .72s; }
  .paw { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; opacity: 0; color: var(--c); }
  .on .paw { animation: burst .85s ease-out .55s forwards; }
  .msg h2 { font: 700 30px/1.15 Fredoka, sans-serif; margin: 30px 0 6px; }
  .msg p { margin: 0; font-size: 15px; opacity: .9; }
  .msg > * { opacity: 0; transform: translateY(8px); }
  .on .msg > * { animation: rise .35s ease-out .7s forwards; }
  .on .msg p { animation-delay: .82s; }

  /* Stand-in for /welcome */
  .welcome { position: fixed; inset: 0; background: var(--el-blue); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .welcome.on { opacity: 1; pointer-events: auto; }
  .welcome .panel { width: min(380px, 92vw); background: var(--el-blue-deep); border-radius: 32px; padding: 28px; text-align: left; transform: scale(.6); }
  .welcome.on .panel { animation: pop .45s var(--pop) forwards; }
  .welcome small { color: var(--el-lime); font-weight: 700; letter-spacing: .04em; }
  .welcome h3 { font: 600 30px/1.15 Fredoka, sans-serif; margin: 8px 0 10px; }
  .replay { margin-top: 18px; background: none; border: 1px solid color-mix(in oklab, var(--el-cream) 50%, transparent); color: var(--el-cream); border-radius: 999px; padding: 10px 18px; font: 600 14px Nunito, sans-serif; cursor: pointer; }

  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes ripple { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(.4) rotate(var(--r)); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; }
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .on .disc, .welcome.on .panel { animation: none; transform: none; }
    .on .tick path { animation: none; stroke-dashoffset: 0; }
    .on .ring, .on .paw { animation: none; }
    .on .msg > * { animation: none; opacity: 1; transform: none; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Be among the first. <span>Join the waitlist.</span></h1>
    <p class="note">Prototype: tap the button to see the moment between “I’m In!” and the welcome page.</p>
    <button class="cta" id="join" type="submit">I’m In!
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>
    </button>
    <p class="sr" role="status" id="status"></p>
  </form>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div>
      <div class="badge">
        <span class="ring"></span><span class="ring r2"></span>
        <span class="disc"></span>
        <svg class="tick" viewBox="0 0 132 132"><path d="M40 68 L58 86 L94 48"/></svg>
      </div>
      <div class="msg"><h2>You’re in, pawrent!</h2><p>Saving Bruno’s spot on the list…</p></div>
    </div>
  </div>

  <div class="welcome" id="welcome">
    <div class="panel">
      <small>✓ YOU’RE ON THE LIST.</small>
      <h3>Welcome to Everloyal, Bruno!</h3>
      <p>(Stand-in for the real welcome page.)</p>
      <button class="replay" id="replay" type="button">Replay</button>
    </div>
  </div>

<script>
  const PAW = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>';
  const colours = ["var(--el-lime)", "var(--el-orange)", "var(--el-cream)"];
  const badge = document.querySelector(".badge");
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2 - Math.PI / 2, d = 104 + (i % 2) * 18;
    const s = document.createElement("span");
    s.className = "paw"; s.innerHTML = PAW;
    s.style.cssText = `--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d)}px;--r:${Math.round((a * 180) / Math.PI + 90)}deg;--c:${colours[i % 3]}`;
    badge.appendChild(s);
  }
  const join = document.getElementById("join"), overlay = document.getElementById("overlay"), welcome = document.getElementById("welcome"), status = document.getElementById("status");
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    join.disabled = true; join.innerHTML = '<span class="spin" aria-hidden="true"></span> Joining…';
    setTimeout(() => {                       // stands in for the real save (min ~500 ms so it feels earned)
      overlay.classList.add("on");
      status.textContent = "You’re on the list. Taking you to your welcome page.";
      if ("vibrate" in navigator) navigator.vibrate([24, 40, 24]);   // Android haptic tick; ignored elsewhere
      setTimeout(() => { welcome.classList.add("on"); overlay.classList.remove("on"); }, 1750);
    }, 800);
  });
  document.getElementById("replay").addEventListener("click", () => location.reload());
</script>
</body>
</html>
